# Re-assert 0600 root:root on NetworkManager system-connection profiles at every boot.
# NM refuses to load the PSK from a group/world-readable keyfile (by design), so a
# mangled mode — e.g. from an unclean power-off mid-rewrite (NM updates seen-bssids/
# timestamp on each connect) — silently breaks wifi association. systemd-tmpfiles runs
# before NetworkManager and fixes the mode. (Real fix = read-only rootfs.)
z /etc/NetworkManager/system-connections/* 0600 root root - -
