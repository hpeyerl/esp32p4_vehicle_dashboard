; =============================================================
;  EV Dashboard — PlatformIO Project Configuration
;
;  Build targets:
;    pio run -e tab5           → M5Stack Tab5  (ST7123,  720×1280)
;    pio run -e waveshare      → Waveshare 12.3" (HX8399-C, 720×1920)
;    pio run -e stub           → No display (software framebuffer)
;
;  OTA upload (after first USB flash):
;    pio run -e waveshare -t upload        # uses ev-dashboard.local
;    OTA_HOST=192.168.1.x pio run -e waveshare -t upload
;
;  First flash / recovery (USB, writes full image):
;    pio run -e waveshare_usb -t upload --upload-port /dev/ttyACM0
;    pio run -e stub_debug_usb -t upload --upload-port /dev/ttyACM0
; =============================================================

[platformio]
default_envs = stub_debug_usb
boards_dir   = boards
src_dir      = src
include_dir  = include

; ── Shared framework settings ──────────────────────────────────────────────
[env]
framework      = espidf
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, time

; ── Shared ESP32-P4 platform ───────────────────────────────────────────────
[p4_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board    = esp32p4_dev
platform_packages =
    platformio/toolchain-riscv32-esp @ 14.2.0+20241119
extra_scripts =
    pre:scripts/patch_espidf_builder.py
    pre:scripts/copy_lv_conf.py
    pre:scripts/remove_arm_asm.py
    upload:scripts/ota_upload.py
board_build.partitions = partitions_16MB_ota.csv
upload_protocol   = custom
custom_ota_host   = ev-dashboard.local
custom_ota_port   = 80

; ── Shared build flags ─────────────────────────────────────────────────────
[flags_common]
build_flags =
    -Wl,--whole-archive,${PROJECT_BUILD_DIR}/${PIOENV}/esp-idf/espressif__esp_hosted/libespressif__esp_hosted.a,--no-whole-archive
    -DCONFIG_TWAI_ISR_IN_IRAM=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    -I${PROJECT_SRC_DIR}
    -I${PROJECT_DIR}/managed_components/lvgl__lvgl
    -I${PROJECT_DIR}/managed_components/lvgl__lvgl/src
    -DUNITS_METRIC=1
    -DSIM_DATA=1
    -DTWAI_TX_PIN=53
    -DTWAI_RX_PIN=3

; ══════════════════════════════════════════════════════════════════════════
;  TARGET: M5Stack Tab5
; ══════════════════════════════════════════════════════════════════════════
[env:tab5]
extends = p4_base
build_flags =
    ${flags_common.build_flags}
    -DDISPLAY_TARGET=1
    -DLCD_H_RES=1280
    -DLCD_V_RES=720
    -DOTA_WIFI_MODE=1

[env:tab5_debug]
extends = env:tab5
build_type = debug
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.defaults.debug
build_flags =
    ${env:tab5.build_flags}
    -DDASHBOARD_DEBUG_CAN=1

[env:tab5_usb]
extends = env:tab5
upload_protocol = esptool
upload_speed    = 921600
; bootloader at 0x2000 (ESP32-P4 requirement)
board_build.flash_extra_images =
    0x2000  ${BUILD_DIR}/bootloader.bin

; ══════════════════════════════════════════════════════════════════════════
;  TARGET: Waveshare 12.3" (HX8399-C, 2-lane DSI)
; ══════════════════════════════════════════════════════════════════════════
[env:waveshare]
extends = p4_base
build_flags =
    ${flags_common.build_flags}
    -DDISPLAY_TARGET=2
    -DLCD_H_RES=1920
    -DLCD_V_RES=720
    ; ── I2C (GT911 touch) — GPIO7/8 per P4-Nano DSI connector schematic ──
    -DWS_I2C_SDA=7
    -DWS_I2C_SCL=8
    -DWS_TOUCH_INT=23
    -DWS_TOUCH_RST=24
    -DWS_GT911_I2C_ADDR=0x5D
    -DWS_LCD_RESET=27
    -DWS_BACKLIGHT_GPIO=22
    -DOTA_WIFI_MODE=1
    -DVSS_PULSE_PIN=5

[env:waveshare_debug]
extends = env:waveshare
build_type = debug
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.defaults.debug
build_flags =
    ${env:waveshare.build_flags}
    -DDASHBOARD_DEBUG_CAN=1

[env:waveshare_usb]
extends = env:waveshare
upload_protocol = esptool
upload_speed    = 921600
; bootloader at 0x2000 (ESP32-P4 requirement)
board_build.flash_extra_images =
    0x2000  ${BUILD_DIR}/bootloader.bin

[env:waveshare_debug_usb]
extends = env:waveshare_debug
upload_protocol = esptool
upload_speed    = 921600
; bootloader at 0x2000 (ESP32-P4 requirement)
board_build.flash_extra_images =
    0x2000  ${BUILD_DIR}/bootloader.bin

; ══════════════════════════════════════════════════════════════════════════
;  TARGET: Stub (no display hardware)
;  LVGL renders to software framebuffer. WiFi/OTA/CAN/VSS work normally.
;  MJPEG stream at http://ev-dashboard.local/stream (TODO)
; ══════════════════════════════════════════════════════════════════════════
[env:stub]
extends = p4_base
build_flags =
    ${flags_common.build_flags}
    -DDISPLAY_STUB=1
    -DLCD_H_RES=1920
    -DLCD_V_RES=720
    -DOTA_WIFI_MODE=1

[env:stub_debug]
extends = env:stub
build_type = debug
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.defaults.debug
build_flags =
    ${env:stub.build_flags}
    -DDASHBOARD_DEBUG_CAN=1

[env:stub_usb]
extends = env:stub
upload_protocol = esptool
upload_speed    = 921600
; bootloader at 0x2000 (ESP32-P4 requirement)
board_build.flash_extra_images =
    0x2000  ${BUILD_DIR}/bootloader.bin

[env:stub_debug_usb]
extends = env:stub_debug
upload_protocol = esptool
upload_speed    = 921600
; bootloader at 0x2000 (ESP32-P4 requirement)
board_build.flash_extra_images =
    0x2000  ${BUILD_DIR}/bootloader.bin
