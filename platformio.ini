; =============================================================
;  EV Dashboard — PlatformIO Project Configuration
;
;  Build targets:
;    pio run -e tab5           → M5Stack Tab5  (ST7123,  720×1280)
;    pio run -e waveshare      → Waveshare 12.3" (HX8399-C, 720×1920)
;    pio run -e tab5_debug     → Tab5 + verbose logging
;    pio run -e waveshare_debug→ Waveshare + verbose logging
;
;  OTA upload (after first USB flash):
;    pio run -e waveshare -t upload        # uses ev-dashboard.local
;    OTA_HOST=192.168.1.x pio run -t upload  # explicit IP
;
;  First flash must be via USB (OTA partitions not yet written).
;  Subsequent flashes can be USB or OTA.
;
;  Adding a new display:
;    1. Add display backend files (see display_driver.h)
;    2. Copy [env:waveshare] block, set DISPLAY_TARGET + resolution
; =============================================================

[platformio]
default_envs = waveshare
boards_dir   = boards
src_dir      = src
include_dir  = include

; ── Shared framework settings ──────────────────────────────────────────────
[env]
framework      = espidf
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    lvgl/lvgl @ ^9.1.0

; ── Shared ESP32-P4 platform ───────────────────────────────────────────────
[p4_base]
; IDF 5.4.2 via pioarduino — do NOT upgrade to 5.5.x:
;   - Confirmed DSI display bug on P4 (espressif/esp-idf#18083)
;   - PSRAM/ROM issues with v1.3 silicon
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board    = esp32p4_dev
platform_packages =
    platformio/toolchain-riscv32-esp @ 14.2.0+20241119
extra_scripts =
    pre:scripts/patch_espidf_builder.py
    pre:scripts/copy_lv_conf.py
    pre:scripts/remove_arm_asm.py
    upload:scripts/ota_upload.py
board_build.partitions = partitions_16MB_ota.csv
; OTA upload — pio run -t upload pushes firmware over WiFi
; First flash must be USB. After that, OTA works.
upload_protocol   = custom
custom_ota_host   = ev-dashboard.local
custom_ota_port   = 80

; ── Shared build flags ─────────────────────────────────────────────────────
[flags_common]
build_flags =
    -DCONFIG_TWAI_ISR_IN_IRAM=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_SRC_DIR}
    -DUNITS_METRIC=1
    -DSIM_DATA=1
    -DTWAI_TX_PIN=53
    -DTWAI_RX_PIN=54

; ══════════════════════════════════════════════════════════════════════════
;  TARGET: M5Stack Tab5
;  Display: ST7123, 2-lane DSI, 720×1280 portrait → LVGL 1280×720 landscape
; ══════════════════════════════════════════════════════════════════════════
[env:tab5]
extends = p4_base
build_flags =
    ${flags_common.build_flags}
    -DDISPLAY_TARGET=1
    -DLCD_H_RES=1280
    -DLCD_V_RES=720
    ; OTA WiFi — 1=STA (join network), 2=AP (create hotspot)
    -DOTA_WIFI_MODE=1
    ; Tab5 pin assignments (from schematic — do not change)
    ; I2C: shared bus for touch + IO expander
    ; Touch INT=GPIO23, Backlight=GPIO22
    ; LCD/touch reset via PI4IOE at I2C 0x43, no direct reset GPIO

; ══════════════════════════════════════════════════════════════════════════
;  TARGET: Waveshare 12.3" (HX8399-C)
;  Display: 4-lane DSI, 720×1920 portrait → LVGL 1920×720 landscape
; ══════════════════════════════════════════════════════════════════════════
[env:waveshare]
extends = p4_base
build_flags =
    ${flags_common.build_flags}
    -DDISPLAY_TARGET=2
    -DLCD_H_RES=1920
    -DLCD_V_RES=720
    ; ── Waveshare pin assignments — verify against P4-Nano schematic ──
    -DWS_I2C_SDA=31
    -DWS_I2C_SCL=32
    -DWS_TOUCH_INT=23
    -DWS_TOUCH_RST=24
    -DWS_LCD_RESET=27
    -DWS_BACKLIGHT_GPIO=22
    ; GT911 I2C address: 0x5D (INT low at reset) or 0x14 (INT high at reset)
    -DWS_GT911_I2C_ADDR=0x5D
    ; OTA WiFi — 1=STA (join network), 2=AP (create hotspot)
    -DOTA_WIFI_MODE=1

; ══════════════════════════════════════════════════════════════════════════
;  USB flash variants — use these when:
;    - First flash on a new device
;    - Recovering a bricked OTA partition
;    - Changing the partition table layout
;  These write bootloader + partition table + otadata + app in one shot.
;  After this, switch back to the regular env for OTA updates.
;    pio run -e waveshare_usb -t upload --upload-port /dev/ttyACM0
;    pio run -e tab5_usb     -t upload --upload-port /dev/ttyACM0
; ══════════════════════════════════════════════════════════════════════════
[env:waveshare_usb]
extends = env:waveshare
upload_protocol = esptool
upload_speed    = 921600

[env:tab5_usb]
extends = env:tab5
upload_protocol = esptool
upload_speed    = 921600

; ══════════════════════════════════════════════════════════════════════════
;  Debug variants
; ══════════════════════════════════════════════════════════════════════════
[env:tab5_debug]
extends = env:tab5
build_type = debug
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.defaults.debug
build_flags =
    ${env:tab5.build_flags}
    -DDASHBOARD_DEBUG_CAN=1

[env:waveshare_debug]
extends = env:waveshare
build_type = debug
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.defaults.debug
build_flags =
    ${env:waveshare.build_flags}
    -DDASHBOARD_DEBUG_CAN=1
