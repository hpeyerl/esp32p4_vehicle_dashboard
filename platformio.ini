; =============================================================
;  EV Dashboard — PlatformIO Project Configuration
;  Target:  ESP32-P4 (ESP32-P4-Nano or DevKit)
;  Display: Waveshare 10.1" DSI-Touch-A (1280x800, MIPI DSI)
;  CAN:     TWAI peripheral (ESP32-P4 built-in)
;  UI:      LVGL v9
;  Framework: ESP-IDF (via PlatformIO espressif32 platform)
; =============================================================

[platformio]
default_envs = esp32p4_dashboard
boards_dir   = boards
src_dir      = src
include_dir  = include

[env]
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:esp32p4_dashboard]
platform = espressif32 @ 6.13.0
board    = esp32p4_dev

platform_packages =
    platformio/toolchain-riscv32-esp @ 14.2.0+20251107

extra_scripts =
    pre:scripts/patch_espidf_builder.py
    pre:scripts/copy_lv_conf.py
    pre:scripts/remove_arm_asm.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_TWAI_ISR_IN_IRAM=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_SRC_DIR}
    -DLCD_H_RES=1280
    -DLCD_V_RES=800
    -DTWAI_TX_PIN=5
    -DTWAI_RX_PIN=4
    -DTOUCH_SDA_PIN=8
    -DTOUCH_SCL_PIN=9
    -DTOUCH_INT_PIN=3
    -DTOUCH_RST_PIN=2

lib_deps =
    lvgl/lvgl @ ^9.1.0

board_build.partitions = partitions_16MB.csv

; upload_port  = /dev/ttyUSB0
; upload_speed = 921600

[env:esp32p4_debug]
extends = env:esp32p4_dashboard
build_type = debug
build_flags =
    ${env:esp32p4_dashboard.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDASHBOARD_DEBUG_CAN=1

