; =============================================================
;  EV Dashboard — PlatformIO Project Configuration
;  Target:  M5Stack Tab5 (ESP32-P4)
;  Display: 5" 1280×720 IPS MIPI-DSI
;           — ILI9881C + GT911 (units before Oct 14 2025)
;           — ST7123 combined display+touch (units from Oct 14 2025)
;           Check sticker on back of unit to confirm.
;  CAN:     M5Stack IS3050G unit via GPIO_EXT connector
;  UI:      LVGL v9
; =============================================================

[platformio]
default_envs = tab5_dashboard
boards_dir   = boards
src_dir      = src
include_dir  = include

[env]
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:tab5_dashboard]
; M5Stack recommends IDF 5.4.2 for Tab5.
; IDF 5.5.x has a confirmed DSI display bug on Tab5 (espressif/esp-idf#18083)
; and PSRAM/ROM issues with v1.3 silicon.
; pioarduino platform ships IDF 5.4.2 (framework-espidf @ 3.50402.0).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board    = esp32p4_dev

platform_packages =
    platformio/toolchain-riscv32-esp @ 14.2.0+20241119

extra_scripts =
    pre:scripts/patch_espidf_builder.py
    pre:scripts/copy_lv_conf.py
    pre:scripts/remove_arm_asm.py

build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DCONFIG_TWAI_ISR_IN_IRAM=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_SRC_DIR}
    ; ── Tab5 display resolution ──
    -DLCD_H_RES=1280
    -DLCD_V_RES=720
    ; ── Tab5 display driver selection ──
    ; Set to 1 for ILI9881C (units before Oct 14 2025)
    ; Set to 0 for ST7123   (units from Oct 14 2025 onward)
    ; Check the sticker on the back of your unit.
    -DTAB5_DISPLAY_ILI9881C=0
    -DUNITS_METRIC=1
    -DSIM_DATA=1
    ; ── Pin assignments in src/tab5_display.c ──
    ; I2C: SDA=GPIO31 SCL=GPIO32 (all peripherals on one bus)
    ; Touch INT=GPIO23, Backlight=GPIO22 (LEDC)
    ; LCD/touch reset via PI4IOE IO expander at I2C addr 0x43
    ; ── CAN transceiver (M5Stack IS3050G on GPIO_EXT) ──
    ; Connect IS3050G TX pin to GPIO_EXT pin 1 (GPIO 53)
    ; Connect IS3050G RX pin to GPIO_EXT pin 2 (GPIO 54)
    ; These are the external Grove/I2C bus pins repurposed for CAN.
    ; Alternatively use M5-Bus pins — see README.
    -DTWAI_TX_PIN=53
    -DTWAI_RX_PIN=54

lib_deps =
    lvgl/lvgl @ ^9.1.0
    ; Panel and touch drivers are declared in src/idf_component.yml
    ; and pulled from the Espressif component registry automatically.

board_build.partitions = partitions_16MB.csv

; upload_port = /dev/ttyACM0
; upload_speed = 1500000

[env:tab5_debug]
extends = env:tab5_dashboard
build_type = debug
build_flags =
    ${env:tab5_dashboard.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDASHBOARD_DEBUG_CAN=1
