## idf_component.yml
## ESP Component Registry dependencies for ev-dashboard

dependencies:
  idf: ">=5.4.0"

  ## ── Panel drivers ─────────────────────────────────────────────────────
  espressif/esp_lcd_ili9881c:
    version: "^1.0.0"
  espressif/esp_lcd_st7123:
    version: "^1.0.0"
  espressif/esp_lcd_hx8399:
    version: "^1.0.0"

  ## ── Touch drivers ─────────────────────────────────────────────────────
  espressif/esp_lcd_touch_gt911:
    version: "^1.0.0"
  espressif/esp_lcd_touch_st7123:
    version: "^1.0.0"
  espressif/esp_lcd_touch:
    version: "^1.0.0"

  ## ── OTA server dependencies ───────────────────────────────────────────
  ## esp_http_server, esp_wifi, nvs_flash, esp_ota, mdns are all
  ## bundled with IDF 5.4 — no separate entries needed here.
  espressif/mdns:
    version: "^1.0.0"

