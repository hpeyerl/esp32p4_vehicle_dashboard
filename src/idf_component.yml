## idf_component.yml
## ESP Component Registry dependencies for ev-dashboard

dependencies:
  idf: ">=5.4.0"

  ## ?? LVGL ??????????????????????????????????????????????????????????????
  lvgl/lvgl:
    version: "^9.1.0"

  ## ?? Panel drivers ?????????????????????????????????????????????????????
  espressif/esp_lcd_ili9881c:
    version: "^1.0.0"
  espressif/esp_lcd_st7123:
    version: "^1.0.0"
  espressif/esp_lcd_hx8399:
    version: "^1.0.0"

  ## ?? Touch drivers ?????????????????????????????????????????????????????
  espressif/esp_lcd_touch_gt911:
    version: "^1.0.0"
  espressif/esp_lcd_touch_st7123:
    version: "^1.0.0"
  espressif/esp_lcd_touch:
    version: "^1.0.0"

  ## ?? WiFi (ESP32-P4-Nano uses ESP32-C6 coprocessor via ESP-Hosted) ?????
  ## Without these the WiFi MAC shows 00:00:00:00:00:00 and no APs found.
  espressif/esp_wifi_remote:
    version: "0.14.*"
  espressif/esp_hosted:
    version: "1.4.*"

  ## ?? OTA server dependencies ???????????????????????????????????????????
  ## mdns is a managed component on ESP32-P4 ? must be declared explicitly.
  ## esp_http_server, nvs_flash, esp_ota are bundled with IDF 5.4.
  espressif/mdns:
    version: "^1.0.0"
