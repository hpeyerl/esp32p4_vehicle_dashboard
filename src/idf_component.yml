# src/idf_component.yml
#
# ESP-IDF Component Manager dependencies for the Tab5 EV Dashboard.
# PlatformIO with framework=espidf picks this up automatically from src/.
# Components are downloaded on first `pio run` into managed_components/.

dependencies:
  idf: ">=5.3.0"

  # MIPI-DSI panel driver — ILI9881C (Tab5 units before Oct 14 2025)
  espressif/esp_lcd_ili9881c: ">=1.0.1"

  # MIPI-DSI panel driver — ST7123 combined display+touch (Tab5 from Oct 14 2025)
  espressif/esp_lcd_st7123: ">=1.0.0"

  # Touch driver — GT911 (used with ILI9881C variant)
  espressif/esp_lcd_touch_gt911: ">=1.1.0"

  # Touch driver — ST7123 (used with ST7123 display variant)
  espressif/esp_lcd_touch_st7123: ">=1.0.0"

  # Base touch component (required by all touch drivers above)
  espressif/esp_lcd_touch: ">=1.0.0"
